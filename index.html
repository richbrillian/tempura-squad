<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tempura Squad - Pesan Online</title>
<style>
  :root{
    --red:#d62828; --red-dark:#a61b1b; --yellow:#ffd23f; --cream:#fff7ec;
    --ink:#2a1a14; --muted:#7a6a62; --line:#f0dfd0; --ok:#1f9d55;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--cream);color:var(--ink);padding-bottom:96px}
  header{background:var(--red);color:#fff;padding:22px 16px 26px;text-align:center;border-bottom:6px solid var(--yellow)}
  header h1{margin:0;font-size:28px;letter-spacing:.5px}
  header p{margin:4px 0 0;opacity:.92;font-size:14px}
  .promo{margin:14px 16px 0;background:var(--yellow);border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.4;font-weight:600}
  .promo small{display:block;font-weight:500;color:#5a4300;margin-top:2px}
  main{padding:8px 16px}
  h2{font-size:15px;color:var(--red-dark);margin:20px 0 8px;text-transform:uppercase;letter-spacing:.8px}
  .item{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
  .item .info{flex:1;min-width:0}
  .item .name{font-weight:650;font-size:16px}
  .item .price{color:var(--red);font-weight:700;margin-top:2px}
  .item .desc{color:var(--muted);font-size:12px;margin-top:2px}
  .qty{display:flex;align-items:center;gap:10px}
  .qty button{width:36px;height:36px;border-radius:50%;border:none;font-size:20px;font-weight:700;cursor:pointer;background:var(--red);color:#fff}
  .qty button.minus{background:#f3e3d6;color:var(--red-dark)}
  .qty span{min-width:22px;text-align:center;font-weight:700}
  .bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:12px 16px;display:none;box-shadow:0 -6px 18px rgba(0,0,0,.08)}
  .bar.show{display:block}
  .bar button{width:100%;border:none;background:var(--red);color:#fff;font-size:16px;font-weight:700;padding:14px;border-radius:12px;cursor:pointer;display:flex;justify-content:space-between}
  .sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:10}
  .sheet.show{display:flex}
  .panel{background:#fff;width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px 24px}
  .panel h3{margin:0 0 10px;font-size:20px;color:var(--red-dark)}
  .row{display:flex;justify-content:space-between;padding:5px 0;font-size:14px}
